<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161A" />
      <stop offset="100%" stop-color="#090A0C" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="shadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="32" height="32" rx="7.5" fill="url(#bgGrad)" stroke="#23262E" stroke-width="1" />

  <!-- Subtle Contract Scan Arc -->
  <path d="M 19 5.5 A 10 10 0 0 1 26.5 13" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Pilot Delta Wings -->
  <!-- Left Wing (Bright Front Facet) -->
  <path d="M 7.5 22.5 L 16 6.5 L 16 18.5 Z" fill="url(#wingGrad)" />

  <!-- Right Wing (Subdued Depth Facet) -->
  <path d="M 16 6.5 L 24.5 22.5 L 16 18.5 Z" fill="url(#shadeGrad)" />

  <!-- Central Fold Keel -->
  <line x1="16" y1="6.5" x2="16" y2="18.5" stroke="#090A0C" stroke-width="0.8" opacity="0.6" />

  <!-- Precision Obligation Node Marker at Apex -->
  <circle cx="16" cy="6.5" r="2.2" fill="#10B981" />
  <circle cx="16" cy="6.5" r="0.9" fill="#FFFFFF" />
</svg>